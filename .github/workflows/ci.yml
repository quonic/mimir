name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install OpenSSL development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: nightly

      - name: Report Odin version
        run: odin version

      - name: Check
        run: odin check .

      - name: Main Test
        run: odin test .

      - name: agent Test
        run: odin test agent

      - name: ai Test
        run: odin test ai

      - name: approval_safety Test
        run: odin test approval_safety

      - name: builtin_tools Test
        run: odin test builtin_tools

      - name: code_index Test
        run: odin test code_index

      - name: commands Test
        run: odin test commands

      - name: console Test
        run: odin test console

      - name: input_history Test
        run: odin test input_history

      - name: logs Test
        run: odin test logs

      - name: settings Test
        run: odin test settings

      - name: text_input Test
        run: odin test text_input

      - name: tool_policy Test
        run: odin test tool_policy

      - name: vdb Test
        run: odin test vdb

      - name: widgets Test
        run: odin test widgets

      - name: Build
        run: odin build . -out:mimir${{ runner.os == 'Windows' && '.exe' || '' }}
