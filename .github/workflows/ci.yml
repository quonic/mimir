name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install OpenSSL development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: nightly

      - name: Report Odin version
        run: odin version

      - name: Check
        run: odin check .

      - name: Test
        shell: bash
        run: |
          # Run every package's tests, collecting all failures instead of stopping at the first one.
          declare -a packages=(
            "."
            "agent"
            "ai"
            "approval_safety"
            "builtin_tools"
            "code_index"
            "commands"
            "console"
            "input_history"
            "logs"
            "settings"
            "text_input"
            "tool_policy"
            "vdb"
            "widgets"
          )

          failed=()
          for pkg in "${packages[@]}"; do
            echo "::group::odin test $pkg"
            if ! odin test "$pkg"; then
              failed+=("$pkg")
            fi
            echo "::endgroup::"
          done

          if [ "${#failed[@]}" -ne 0 ]; then
            echo "The following package tests failed:"
            printf ' - %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Build
        run: odin build . -out:mimir${{ runner.os == 'Windows' && '.exe' || '' }}
